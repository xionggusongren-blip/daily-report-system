<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週報生成 - 営業日報システム</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .period-selector {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }
    .quick-period {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .quick-period button {
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .quick-period button:hover {
      background: var(--background-color);
    }
    .quick-period button.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    .report-header {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      padding: 1.5rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .report-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .report-period {
      font-size: 0.875rem;
      opacity: 0.9;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .summary-box {
      background: var(--background-color);
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
    }
    .summary-box .value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-color);
    }
    .summary-box .label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .daily-section {
      margin-bottom: 1.5rem;
    }
    .daily-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: var(--background-color);
      border-radius: 0.375rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .daily-header:hover {
      background: #e5e7eb;
    }
    .daily-date {
      font-weight: 600;
    }
    .daily-visits {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .daily-content {
      padding: 0 0.75rem;
      display: none;
    }
    .daily-content.open {
      display: block;
    }
    .visit-item {
      padding: 0.75rem;
      border-left: 3px solid var(--primary-color);
      margin-bottom: 0.5rem;
      background: #f9fafb;
    }
    .visit-customer {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .visit-detail {
      font-size: 0.875rem;
      color: #374151;
    }
    .visited-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .visited-tag {
      padding: 0.25rem 0.5rem;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 0.25rem;
      font-size: 0.8rem;
    }
    .export-buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    @media print {
      .header, .period-selector, .export-buttons, .btn { display: none !important; }
      .card { box-shadow: none !important; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="/dashboard.html" class="logo">営業日報システム</a>
      <nav class="nav" id="main-nav">
        <a href="/dashboard.html" class="nav-link">ホーム</a>
        <a href="/report-list.html" class="nav-link">日報一覧</a>
        <a href="/calendar.html" class="nav-link">カレンダー</a>
      </nav>
      <div class="user-info">
        <span class="user-name" id="user-name">-</span>
        <button class="btn btn-outline btn-sm btn-logout" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">📊 週報生成</h1>

    <!-- 期間選択 -->
    <div class="card">
      <div class="period-selector">
        <div class="form-group" style="margin: 0;">
          <label class="form-label">開始日</label>
          <input type="date" id="start-date" class="form-input">
        </div>
        <div class="form-group" style="margin: 0;">
          <label class="form-label">終了日</label>
          <input type="date" id="end-date" class="form-input">
        </div>
        <div class="form-group" style="margin: 0;" id="user-select-group">
          <label class="form-label">担当者</label>
          <select id="target-user" class="form-select">
            <option value="">自分</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="generateReport()">生成</button>
      </div>

      <div class="quick-period">
        <button onclick="setThisWeek()" class="active">今週</button>
        <button onclick="setLastWeek()">先週</button>
        <button onclick="setThisMonth()">今月</button>
        <button onclick="setLastMonth()">先月</button>
      </div>
    </div>

    <!-- 週報プレビュー -->
    <div id="report-preview" style="display: none;">
      <div class="report-header">
        <div class="report-title" id="report-title">週報</div>
        <div class="report-period" id="report-period">-</div>
      </div>

      <!-- サマリー -->
      <div class="card">
        <h3 style="margin: 0 0 1rem 0;">📈 サマリー</h3>
        <div class="summary-grid">
          <div class="summary-box">
            <div class="value" id="sum-reports">-</div>
            <div class="label">日報数</div>
          </div>
          <div class="summary-box">
            <div class="value" id="sum-visits">-</div>
            <div class="label">総訪問件数</div>
          </div>
          <div class="summary-box">
            <div class="value" id="sum-customers">-</div>
            <div class="label">得意先訪問</div>
          </div>
          <div class="summary-box">
            <div class="value" id="sum-suppliers">-</div>
            <div class="label">仕入先訪問</div>
          </div>
          <div class="summary-box">
            <div class="value" id="sum-amount">-</div>
            <div class="label">案件金額合計</div>
          </div>
        </div>
      </div>

      <!-- 訪問先一覧 -->
      <div class="card">
        <h3 style="margin: 0 0 1rem 0;">🏢 訪問先一覧</h3>
        <div style="margin-bottom: 1rem;">
          <h4 style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">得意先</h4>
          <div class="visited-list" id="visited-customers"></div>
        </div>
        <div>
          <h4 style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">仕入先</h4>
          <div class="visited-list" id="visited-suppliers"></div>
        </div>
      </div>

      <!-- 日別詳細 -->
      <div class="card">
        <h3 style="margin: 0 0 1rem 0;">📋 日別詳細</h3>
        <div id="daily-details"></div>
      </div>

      <!-- エクスポート -->
      <div class="card">
        <div class="export-buttons">
          <button class="btn btn-outline" onclick="window.print()">🖨️ 印刷</button>
          <button class="btn btn-outline" onclick="exportText()">📄 テキスト出力</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let reportData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth();
      if (!user) return;

      // 上長・管理者のみユーザー選択可
      if (user.role === 'manager' || user.role === 'admin') {
        await loadUsers();
      } else {
        document.getElementById('user-select-group').style.display = 'none';
      }

      // デフォルト今週
      setThisWeek();
    });

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const users = await res.json();
        const select = document.getElementById('target-user');
        users.forEach(u => {
          const option = document.createElement('option');
          option.value = u.id;
          option.textContent = u.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('ユーザー読み込みエラー:', error);
      }
    }

    function setThisWeek() {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
      const friday = new Date(monday);
      friday.setDate(monday.getDate() + 4);

      document.getElementById('start-date').value = formatDateInput(monday);
      document.getElementById('end-date').value = formatDateInput(friday);
      updateQuickButtons('今週');
    }

    function setLastWeek() {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const lastMonday = new Date(today);
      lastMonday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1) - 7);
      const lastFriday = new Date(lastMonday);
      lastFriday.setDate(lastMonday.getDate() + 4);

      document.getElementById('start-date').value = formatDateInput(lastMonday);
      document.getElementById('end-date').value = formatDateInput(lastFriday);
      updateQuickButtons('先週');
    }

    function setThisMonth() {
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);

      document.getElementById('start-date').value = formatDateInput(firstDay);
      document.getElementById('end-date').value = formatDateInput(lastDay);
      updateQuickButtons('今月');
    }

    function setLastMonth() {
      const today = new Date();
      const firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth(), 0);

      document.getElementById('start-date').value = formatDateInput(firstDay);
      document.getElementById('end-date').value = formatDateInput(lastDay);
      updateQuickButtons('先月');
    }

    function updateQuickButtons(active) {
      document.querySelectorAll('.quick-period button').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === active);
      });
    }

    function formatDateInput(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    async function generateReport() {
      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      const targetUserId = document.getElementById('target-user').value;

      if (!startDate || !endDate) {
        alert('期間を指定してください');
        return;
      }

      let url = `/api/weekly-report?start_date=${startDate}&end_date=${endDate}`;
      if (targetUserId) url += `&target_user_id=${targetUserId}`;

      try {
        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          alert(err.error || '週報の生成に失敗しました');
          return;
        }

        reportData = await res.json();
        renderReport();
      } catch (error) {
        console.error('週報生成エラー:', error);
        alert('週報の生成中にエラーが発生しました');
      }
    }

    function renderReport() {
      const preview = document.getElementById('report-preview');
      preview.style.display = 'block';

      // ヘッダー
      document.getElementById('report-title').textContent = 
        `${reportData.user.name} 週報`;
      document.getElementById('report-period').textContent = 
        `${reportData.period.start_date} ～ ${reportData.period.end_date} | ${reportData.user.department_name || '-'}`;

      // サマリー
      const s = reportData.summary;
      document.getElementById('sum-reports').textContent = s.total_reports;
      document.getElementById('sum-visits').textContent = s.total_visits;
      document.getElementById('sum-customers').textContent = s.customer_visits;
      document.getElementById('sum-suppliers').textContent = s.supplier_visits;
      document.getElementById('sum-amount').textContent = 
        s.total_deal_amount > 0 ? formatAmount(s.total_deal_amount) : '-';

      // 訪問先一覧
      document.getElementById('visited-customers').innerHTML = 
        s.visited_customers.length > 0 
          ? s.visited_customers.map(c => `<span class="visited-tag">${escapeHtml(c)}</span>`).join('')
          : '<span class="text-muted">なし</span>';
      
      document.getElementById('visited-suppliers').innerHTML = 
        s.visited_suppliers.length > 0 
          ? s.visited_suppliers.map(c => `<span class="visited-tag">${escapeHtml(c)}</span>`).join('')
          : '<span class="text-muted">なし</span>';

      // 日別詳細
      renderDailyDetails();
    }

    function renderDailyDetails() {
      const container = document.getElementById('daily-details');

      if (reportData.reports.length === 0) {
        container.innerHTML = '<p class="text-muted">この期間の日報はありません</p>';
        return;
      }

      container.innerHTML = reportData.reports.map((r, idx) => {
        const visitsHtml = r.visits.map(v => {
          const targetName = v.visit_type === 'supplier' 
            ? (v.supplier_name || v.customer_name_manual || '-')
            : (v.customer_name || v.customer_name_manual || '-');
          return `
            <div class="visit-item">
              <div class="visit-customer">${escapeHtml(targetName)}</div>
              <div class="visit-detail">${escapeHtml(v.meeting_content || '-')}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="daily-section">
            <div class="daily-header" onclick="toggleDaily(${idx})">
              <span class="daily-date">${formatDateWithDay(r.report_date)}</span>
              <span class="daily-visits">訪問: ${r.visits.length}件</span>
            </div>
            <div class="daily-content" id="daily-${idx}">
              ${r.work_content ? `<p style="margin-bottom: 0.75rem;"><strong>業務内容:</strong><br>${escapeHtml(r.work_content)}</p>` : ''}
              ${visitsHtml || '<p class="text-muted">訪問記録なし</p>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleDaily(idx) {
      const content = document.getElementById(`daily-${idx}`);
      content.classList.toggle('open');
    }

    function formatAmount(amount) {
      return '¥' + Number(amount).toLocaleString();
    }

    function exportText() {
      if (!reportData) return;

      const s = reportData.summary;
      let text = `【週報】${reportData.user.name}\n`;
      text += `期間: ${reportData.period.start_date} ～ ${reportData.period.end_date}\n`;
      text += `部署: ${reportData.user.department_name || '-'}\n\n`;

      text += `■ サマリー\n`;
      text += `  日報数: ${s.total_reports}\n`;
      text += `  総訪問件数: ${s.total_visits}\n`;
      text += `  得意先訪問: ${s.customer_visits}\n`;
      text += `  仕入先訪問: ${s.supplier_visits}\n`;
      if (s.total_deal_amount > 0) {
        text += `  案件金額合計: ${formatAmount(s.total_deal_amount)}\n`;
      }
      text += `\n`;

      text += `■ 訪問先一覧\n`;
      text += `  得意先: ${s.visited_customers.join('、') || 'なし'}\n`;
      text += `  仕入先: ${s.visited_suppliers.join('、') || 'なし'}\n\n`;

      text += `■ 日別詳細\n`;
      reportData.reports.forEach(r => {
        text += `\n【${r.report_date}】\n`;
        if (r.work_content) {
          text += `業務内容:\n${r.work_content}\n`;
        }
        if (r.visits.length > 0) {
          text += `訪問:\n`;
          r.visits.forEach(v => {
            const name = v.visit_type === 'supplier' 
              ? (v.supplier_name || v.customer_name_manual || '-')
              : (v.customer_name || v.customer_name_manual || '-');
            text += `  - ${name}: ${v.meeting_content || '-'}\n`;
          });
        }
      });

      // ダウンロード
      const blob = new Blob([text], { type: 'text/plain; charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `週報_${reportData.user.name}_${reportData.period.start_date}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
